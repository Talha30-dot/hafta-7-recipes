<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recipes</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- DaisyUI -->
  <link
    href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css"
    rel="stylesheet"
    type="text/css"
  />

  <style>
    body {
      background: #111827;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="max-w-7xl mx-auto px-4 py-8">
    <div class="mb-8">
      <h1 class="text-4xl font-bold text-white">Recipes</h1>
      <p class="text-gray-300 mt-2">DummyJSON API'den gelen tarif kartları</p>
    </div>

    <div id="loading" class="text-center py-10">
      <span class="loading loading-spinner loading-lg text-primary"></span>
      <p class="text-white mt-3">Tarifler yükleniyor...</p>
    </div>

    <div id="errorBox" class="hidden alert alert-error mb-6">
      <span>Veriler alınırken bir hata oluştu.</span>
    </div>

    <div id="recipeList" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const recipeList = document.getElementById('recipeList');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');

    function createRecipeCard(recipe) {
      const cuisine = recipe.cuisine || 'Bilinmiyor';
      const difficulty = recipe.difficulty || 'Belirsiz';
      const calories = recipe.caloriesPerServing || 0;
      const prepTime = recipe.prepTimeMinutes || 0;
      const cookTime = recipe.cookTimeMinutes || 0;
      const servings = recipe.servings || 0;
      const rating = recipe.rating || 0;
      const reviews = recipe.reviewCount || 0;
      const tags = recipe.tags || [];
      const image = recipe.image || 'https://via.placeholder.com/400x250?text=Recipe';
      const mealType = recipe.mealType || [];

      return `
        <div class="card bg-base-100 shadow-xl overflow-hidden hover:shadow-2xl transition duration-300">
          <figure class="h-56 overflow-hidden">
            <img
              src="${image}"
              alt="${recipe.name}"
              class="w-full h-full object-cover"
            />
          </figure>

          <div class="card-body">
            <h2 class="card-title text-2xl">${recipe.name}</h2>

            <div class="flex flex-wrap gap-2 mt-1">
              <div class="badge badge-primary badge-outline">${cuisine}</div>
              <div class="badge badge-secondary">${difficulty}</div>
              <div class="badge badge-accent">${calories} kcal</div>
            </div>

            <p class="text-sm text-gray-600 mt-2">
              <span class="font-medium">Hazırlık:</span> ${prepTime} dk
              <span class="mx-1">|</span>
              <span class="font-medium">Pişirme:</span> ${cookTime} dk
              <span class="mx-1">|</span>
              <span class="font-medium">Porsiyon:</span> ${servings}
            </p>

            <div class="flex items-center gap-2 text-sm text-gray-700 mt-2">
              <span class="text-yellow-500">★★★★★</span>
              <span>(${rating}) - ${reviews} yorum</span>
            </div>

            <div class="flex flex-wrap gap-2 mt-3">
              ${tags.map(tag => `<span class="badge badge-ghost">${tag}</span>`).join('')}
              ${mealType.map(type => `<span class="badge badge-outline">${type}</span>`).join('')}
            </div>
          </div>
        </div>
      `;
    }

    async function getRecipes() {
      try {
        const response = await fetch('https://dummyjson.com/recipes');

        if (!response.ok) {
          throw new Error('API hatası oluştu');
        }

        const data = await response.json();
        const recipes = data.recipes;

        recipeList.innerHTML = recipes
          .map(recipe => createRecipeCard(recipe))
          .join('');
      } catch (error) {
        console.error('Hata:', error);
        errorBox.classList.remove('hidden');
      } finally {
        loading.classList.add('hidden');
      }
    }

    getRecipes();
  </script>
</body>
</html>
